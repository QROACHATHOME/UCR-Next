# Builds and publishes a release when a version tag is pushed:
#   git tag v0.5.0
#   git push origin v0.5.0
# The release gets an installer (UCR-Next-x.y.z-setup.exe) and a portable, self-contained zip
# (no .NET install needed), both built by build/Build-Release.ps1,
# and release notes generated from the commits since the previous tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release and upload the zip

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test -c Release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer and portable zip
        shell: pwsh
        run: ./build/Build-Release.ps1 -Version '${{ github.ref_name }}'

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/UCR-Next-*-setup.exe
            dist/UCR-Next-*-win-x64.zip
          generate_release_notes: true
